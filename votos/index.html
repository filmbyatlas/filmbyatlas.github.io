<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>¿A quién votarías?</title>
<style>
  :root { --bg: #eef1f6; --ink: #141a2e; --muted: #5a6379; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1220; --ink: #e9ecf5; --muted: #9aa3ba; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 2rem; margin: 0 0 12px; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>¿A quién votarías?</h1>
  <p id="msg">El test se está terminando de montar. Vuelve a abrir este enlace en un rato.</p>
</main>
<script>
// Dirección de la aplicación web de Google Apps Script que sirve el test.
const SCRIPT_URL = "";
if (SCRIPT_URL) { document.getElementById("msg").textContent = "Abriendo el test…"; location.replace(SCRIPT_URL); }
</script>
</body>
</html>
